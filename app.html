<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a2160">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>C2 Finance</title>
  <meta name="description" content="BPO Financeiro inteligente. Gestão, análise e visualização de dados financeiros para múltiplas organizações.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div id="home" class="sky layer"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- ============ TELA DE LOGIN / CADASTRO ============ -->
  <section id="auth-view" class="auth-view hidden">
    <a href="index.html" class="back-home">
      <span class="back-home-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      Voltar ao site
    </a>
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">C2</div>
        <div class="brand-text">
          <strong>C2 Finance</strong>
          <span>BPO Financeiro</span>
        </div>
      </div>

      <form id="login-form" class="auth-form">
        <h2>Bem-vindo de volta</h2>
        <p class="muted">Acesse seu painel gerencial</p>
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="login-email" inputmode="email" autocomplete="email" required placeholder="voce@empresa.com.br">
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button type="submit" class="btn primary block">Entrar</button>
        <p id="login-msg" class="msg"></p>
      </form>
    </div>
    <p class="auth-foot">C2 Finance · Segurança multi-tenant · Seus dados protegidos por organização</p>
  </section>

  <!-- ============ APP ============ -->
  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <button id="btn-drawer" class="icon-btn" aria-label="Menu">
        <span class="hamb"><i></i><i></i><i></i></span>
      </button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-right">
        <button id="btn-theme" class="theme-toggle" role="switch" aria-checked="true" aria-label="Alternar tema">
          <span class="tog-track"></span>
          <span class="tog-thumb"><span class="tog-sun" data-i="sun" data-is="14"></span><span class="tog-moon" data-i="moon" data-is="14"></span></span>
        </button>
      </div>
    </header>

    <div id="drawer" class="drawer">
      <div class="drawer-scrim" id="drawer-scrim"></div>
      <aside class="drawer-panel">
        <div class="drawer-head">
          <div class="brand small">
            <div class="brand-mark">C2</div>
            <div class="brand-text"><strong>C2 Finance</strong><span id="org-name-drawer">—</span></div>
          </div>
        </div>
        <nav id="nav" class="nav">
          <button class="nav-item active" data-view="dashboard"><span class="nav-ico" data-i="home"></span>Dashboard</button>
          <button class="nav-item" data-view="fluxo"><span class="nav-ico" data-i="trend"></span>Fluxo de Caixa</button>
          <button class="nav-item" data-view="transacoes"><span class="nav-ico" data-i="swap"></span>Transações</button>
          <button class="nav-item" data-view="contas"><span class="nav-ico" data-i="invoice"></span>Contas a Pagar / Receber</button>
          <button class="nav-item" data-view="clientes"><span class="nav-ico" data-i="users"></span>Clientes</button>
          <button class="nav-item" data-view="relatorios"><span class="nav-ico" data-i="chart"></span>Relatórios & BI</button>
          <button class="nav-item" data-view="config"><span class="nav-ico" data-i="gear"></span>Configurações</button>
        </nav>
        <div class="drawer-foot">
          <div class="admin-nav">
            <div class="org-label">Administração</div>
            <button class="nav-item admin-only" data-view="usuarios"><span class="nav-ico" data-i="users"></span>Usuários</button>
            <button class="nav-item admin-only" data-view="organizacoes"><span class="nav-ico" data-i="briefcase"></span>Organizações</button>
          </div>
          <button id="btn-logout" class="btn ghost block"><span class="nav-ico" data-i="logout"></span>Sair</button>
        </div>
      </aside>
    </div>

    <main id="view" class="view"></main>

    <button id="fab" class="fab" aria-label="Nova transação"><span data-i="plus" class="fab-inner"></span></button>

    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div id="sheet" class="sheet"></div>
    <div id="modal" class="modal hidden"></div>
    <div id="toasts" class="toasts"></div>
  </div>

  <svg id="icons" style="display:none" aria-hidden="true"></svg>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10"></script>
  <script src="js/config.local.js?v=4"></script>
  <script src="js/config.js?v=5"></script>
  <script src="js/utils.js?v=4"></script>
  <script src="js/supabaseClient.js?v=5"></script>
  <script src="js/theme.js?v=3"></script>
  <script src="js/background.js?v=1"></script>
  <script src="js/charts.js?v=3"></script>
  <script src="js/views/reports.js?v=4"></script>
  <script src="js/views/crud.js?v=6"></script>
  <script src="js/views/users.js?v=2"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
